<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekomendasi Produk Pilihan</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#000;
    color:white;
    text-align:center;
    padding:30px 20px;
}

header h1{
    margin-bottom:10px;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

.card h3{
    margin-bottom:10px;
}

.card p{
    color:#666;
    margin-bottom:15px;
    font-size:14px;
}

.btn{
    display:block;
    text-align:center;
    background:#ff0050;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
}

.btn:hover{
    background:#d90445;
}

footer{
    text-align:center;
    padding:20px;
    color:#777;
}
</style>
</head>

<body>

<header>
    <h1>🔥 Produk Viral Pilihan</h1>
    <p>Promo Terbaik Hari Ini</p>
</header>

<div class="container">

<div class="product-grid">

    <div class="card">
        <img src="https://via.placeholder.com/400x400" alt="Produk 1">
        <div class="card-content">
            <h3>Asaya atasan kemeja wanita kerah lengan panjang kasual</h3>
            <a href="https://vt.tokopedia.com/t/ZS925sCMGoEfL-z6hM2/" target="_blank" class="btn">
                Beli Sekarang
            </a>
        </div>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/400x400" alt="Produk 2">
        <div class="card-content">
            <h3>Lemari Napolly</h3>
            <p>Lemari plastik kuat dan tahan lama.</p>
            <a href="LINK_AFFILIATE_TIKTOK_2" target="_blank" class="btn">
                Beli Sekarang
            </a>
        </div>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/400x400" alt="Produk 3">
        <div class="card-content">
            <h3>Kursi Santai</h3>
            <p>Kursi nyaman untuk keluarga.</p>
            <a href="LINK_AFFILIATE_TIKTOK_3" target="_blank" class="btn">
                Beli Sekarang
            </a>
        </div>
    </div>

</div>

</div>

<footer>
    © 2026 Rekomendasi Produk Pilihan
</footer>

</body>
</html>
